[package]
name = "agent-spreadsheet-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM-facing byte/session API wrapper for agent-spreadsheet"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
agent-spreadsheet = { path = "../agent-spreadsheet", default-features = false, features = ["recalc-formualizer"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
umya-spreadsheet = "2.3.2"
tokio = { version = "1.37", features = ["macros", "rt"] }
tempfile = "3.10"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
