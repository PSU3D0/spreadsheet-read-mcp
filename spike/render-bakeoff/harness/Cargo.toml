[package]
name = "harness"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["ref-a", "ref-b", "spike-d", "sd-rustybuzz", "sd-font-full"]
ref-a = ["dep:betteroffice-xlsx"]
ref-b = ["dep:readany-render"]
spike-d = ["dep:spike-d", "dep:umya-spreadsheet", "spike-d/extract"]
# text stack / font strategy pass-throughs for spike D
sd-rustybuzz = ["spike-d/text-rustybuzz"]
sd-abglyph = ["spike-d/text-abglyph"]
sd-font-full = ["spike-d/font-full"]
sd-font-subset = ["spike-d/font-subset"]

[dependencies]
spike-d = { path = "../spike-d", optional = true, default-features = false }
umya-spreadsheet = { version = "2", optional = true }
betteroffice-xlsx = { version = "0.1.0", optional = true }
readany-render = { version = "0.1.3", optional = true }
serde_json = "1"
png = "0.18"

[[bin]]
name = "bakeoff"
path = "src/main.rs"
