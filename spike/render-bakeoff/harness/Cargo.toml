[package]
name = "harness"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["ref-a", "ref-b", "spike-d"]
ref-a = ["dep:betteroffice-xlsx"]
ref-b = ["dep:readany-render"]
spike-d = ["dep:spike-d", "dep:umya-spreadsheet"]

[dependencies]
spike-d = { path = "../spike-d", optional = true }
umya-spreadsheet = { version = "2", optional = true }
betteroffice-xlsx = { version = "0.1.0", optional = true }
readany-render = { version = "0.1.3", optional = true }
serde_json = "1"

[[bin]]
name = "bakeoff"
path = "src/main.rs"
