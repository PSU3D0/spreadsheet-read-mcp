[package]
name = "spike-d"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["text-rustybuzz", "font-full", "extract"]
# --- text stack switch (exactly one) ---
text-rustybuzz = ["dep:rustybuzz"]
text-abglyph = ["dep:ab_glyph"]
# --- font strategy switch (exactly one) ---
font-full = []
font-subset = []
# --- umya extraction; off for the wasm text-stack size probe ---
extract = ["dep:umya-spreadsheet"]

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
png = "0.18"
rustybuzz = { version = "0.20", optional = true }
ab_glyph = { version = "0.2", optional = true }
umya-spreadsheet = { version = "2", optional = true }

[lib]
crate-type = ["rlib"]
