# The Commands enum (50+ variants with nested subcommands) exceeds the default
# 2 MiB test-thread stack when compiled in debug profile. 8 MiB matches the
# main-thread default and avoids stack overflows in clap derive tests.
[env]
RUST_MIN_STACK = "8388608"

[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
# getrandom 0.3 (pulled in by ahash, which umya and the renderer both depend on)
# refuses to build for wasm32-unknown-unknown unless a backend is named. The
# browser/Node backend is the only correct one for this target.
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
